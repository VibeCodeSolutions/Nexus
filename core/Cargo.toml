[package]
name = "nexus-core"
version = "0.1.3"
edition = "2021"
description = "NEXUS Personal OS — Core Daemon"
authors = ["Kai Krauthausen <c0nn3tor@googlemail.com>"]
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "fs"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
async-trait = "0.1"
rand = "0.9"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = "0.4"
sha2 = "0.10"
dialoguer = "0.11"
dirs = "5"
webbrowser = "1"
urlencoding = "2"
tower-http = { version = "0.6", features = ["cors"] }
gray_matter = "0.3"
# Sprint Nightvision NV-1: Foto-Braindump-Pipeline. Bilder werden vor dem
# Vision-LLM-Call serverseitig auf max. 1920px Längskante downscaled. Wir
# brauchen nur JPEG- und PNG-Decoder; default-Features sind deaktiviert, um
# unnötige Format-Bibliotheken (TIFF, AVIF, …) aus dem Build zu halten.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# FEAT-002 Sprint A: iCal-Export-Endpoints für Sparks und Tasks.
# Strongly-typed Builder für VCALENDAR/VEVENT, kein OAuth, keine Netzwerk-IO.
icalendar = "0.17"


[dev-dependencies]
tempfile = "3"
